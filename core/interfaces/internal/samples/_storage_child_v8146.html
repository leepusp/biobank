<section class="border rounded p-3 mt-3 mb-3"
         data-b3-storage-child-v8146
         data-catalog-url="{% url 'storage_path_register_v8146' %}"
         data-create-url="{% url 'storage_path_register_v8146' %}"
         aria-label="Register physical storage path">

    <div class="fw-semibold mb-2">
        Register Physical Path
    </div>

    <p class="form-text">
        Enter your own level names in the Path Builder above,
        pressing Enter after each level. Register the complete
        hierarchy when ready.
    </p>

    <label class="form-label"
           for="storageChildWorkspaceV8146">
        Storage workspace
    </label>

    <select id="storageChildWorkspaceV8146"
            class="form-select"
            autocomplete="off">
        <option value="">Loading workspaces...</option>
    </select>

    <p class="form-text mt-2">
        Path:
        <strong id="storageChildCurrentPathV8146">
            No path entered
        </strong>
    </p>

    <button id="storageChildCreateV8146"
            type="button"
            class="btn btn-outline-primary"
            disabled>
        Register Physical Path
    </button>

    <p id="storageChildStatusV8146"
       class="form-text mt-2 mb-0"
       role="status"
       aria-live="polite">
        Select a workspace and enter a path.
    </p>

    <p class="form-text mt-2 mb-0">
        No authorized workspace?
        <a href="{% url 'storage_workspace' %}">
            Open Storage management
        </a>.
    </p>
</section>

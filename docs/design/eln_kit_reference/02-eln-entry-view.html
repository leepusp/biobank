<script type="text/x-dc" data-dc-script data-props='{"showNew":{"editor":"boolean","default":true,"section":"Annotations"},"$preview":{"width":1440,"height":1880}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { done: [true, true, true, false, false, false], locked: true, tab: 'comments', status: 'Running' };
  }
  renderVals() {
    const st = this.state;
    const steps = [
      ['Preparation', 'Grow overnight host culture (TSB, 28 °C)', 'done 1 Nov 18:10'],
      ['Preparation', 'Prepare 10-fold dilutions of lysate in SM buffer', 'done 2 Nov 09:30'],
      ['Preparation', 'Melt 0.5% top agar and hold at 48 °C', 'done 2 Nov 09:45'],
      ['Plating and reading', 'Plate 10⁻⁵ to 10⁻⁸ in duplicate', 'due today 16:00'],
      ['Plating and reading', 'Repeat 10⁻⁷ in triplicate (reviewer request)', 'due 3 Nov · notify'],
      ['Plating and reading', 'Count plaques and record titer', 'due 3 Nov']
    ];
    const items = steps.map((s, i) => ({
      group: s[0], body: s[1], meta: st.done[i] ? s[2].replace(/^due.*$/, 'done just now') : s[2], done: st.done[i],
      rowStyle: st.done[i] ? 'background:#f6faf7' : '',
      textStyle: st.done[i] ? 'color:#5b6672;text-decoration:line-through' : '',
      toggle: () => { const d = st.done.slice(); d[i] = !d[i]; this.setState({ done: d }); }
    }));
    const groups = ['Preparation', 'Plating and reading'].map(g => ({ name: g, steps: items.filter(x => x.group === g) }));
    const doneCount = st.done.filter(Boolean).length;

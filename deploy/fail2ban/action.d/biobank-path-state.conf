[Definition]

# Maintain only C3 LIMS-owned runtime ban state. No host-wide
# packet-filter rule is created or modified.

actionstart = /usr/local/sbin/biobank-auth-guard-state start

actionflush = /usr/local/sbin/biobank-auth-guard-state flush

actionstop = /usr/local/sbin/biobank-auth-guard-state stop

actioncheck = /usr/local/sbin/biobank-auth-guard-state check

actionban = /usr/local/sbin/biobank-auth-guard-state ban <ip> <time> <bantime>

actionunban = /usr/local/sbin/biobank-auth-guard-state unban <ip>

[Definition]

# Match only authentication failures emitted by the dedicated
# B3 LIMS PAM service from Apache httpd.
failregex = ^.*pam_unix\(biobank:auth\): authentication failure;.*\brhost=<HOST>(?:\s|$)

ignoreregex =

# Keep the detector scoped to Apache journal records.
journalmatch = _SYSTEMD_UNIT=httpd.service + _COMM=httpd

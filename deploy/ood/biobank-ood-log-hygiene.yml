# Biobank/Open OnDemand logging deployment contract.
#
# Merge the active setting below into:
#   /etc/ood/config/ood_portal.yml
#
# The Open OnDemand portal generator uses this value to emit:
#
#   LogFormat <value>
#   TransferLog <accesslog>
#
# The format intentionally uses %m %U %H rather than %r.
#
# %U records the requested URL path without the query string.
# Raw Referer logging is intentionally omitted because a Referer
# may itself contain a credential-bearing URL.
#
# Together these controls prevent Jupyter bearer tokens and other
# query-string credentials from being persisted in the portal
# access log through either the request target or Referer header.

logformat: '"%h %l %u %t \"%m %U %H\" %>s %b \"%{User-Agent}i\""'

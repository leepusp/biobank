# Scoped node proxy for official Biobank Jupyter Notebook servers.
#
# This configuration is included inside the Open OnDemand TLS
# VirtualHost.
#
# Authentication architecture:
#
#   Control plane:
#       Apache PAM -> Django/Biobank -> object authorization
#
#   Jupyter data plane:
#       root-controlled active-session binding -> OOD proxy
#       -> native Jupyter token/cookie authentication
#
# HTTP Basic authentication MUST NOT be enabled on this route.
# Jupyter uses the Authorization header for its own token
# authentication, and a Basic-auth requirement would reject
# legitimate Jupyter API requests.

LuaAuthzProvider \
    biobank-jupyter-session \
    /etc/ood/lua/biobank_jupyter_session_authz.lua \
    biobank_jupyter_session_authz

<LocationMatch "^/biobank/internal/lab-tools/jupyter/(?<notebook_id>\d+)/node/(?<host>gn01|gn02|gn03|n01)/(?<port>\d+)">

    AuthzSendForbiddenOnFailure On

    # The Open OnDemand LuaHookLog request logger records
    # r.filename at INFO level. Jupyter bootstrap requests may
    # contain the native bearer token in the query string.
    #
    # Suppress INFO-level mod_lua request logging only for this
    # Biobank Jupyter data-plane route. WARN/ERROR logging remains.
    LogLevel lua_module:warn

    # Permit proxying only to an endpoint represented by a
    # root-controlled active Biobank Jupyter session binding.
    Require biobank-jupyter-session

    # OOD currently consumes this identity only as forwarded
    # metadata. It is NOT an authorization mechanism.
    SetEnv OOD_USER_ENV BIOBANK_JUPYTER_PROXY_USER
    SetEnv BIOBANK_JUPYTER_PROXY_USER biobank

    Header edit Location "^[^/]+//[^/]+" ""
    Header edit* Set-Cookie ";\s*(?i)Domain[^;]*" ""
    Header edit* Set-Cookie ";\s*(?i)Path[^;]*" ""
    Header edit Set-Cookie "^([^;]+)" "$1; Path=/biobank/internal/lab-tools/jupyter/%{MATCH_NOTEBOOK_ID}e/node/%{MATCH_HOST}e/%{MATCH_PORT}e"

    LuaHookFixups node_proxy.lua node_proxy_handler
</LocationMatch>

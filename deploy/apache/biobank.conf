# B3 LIMS Apache routing and authentication boundary.

# =========================
# LEGACY NAVIGATION REDIRECTS
# =========================

# Retain only controlled navigational compatibility for the previous
# public mount. Deep internal /biobank routes are intentionally not
# retained as a second application namespace.

# Preserve navigation from the previously deployed mistyped namespace.
# It is redirect-only and must not become a second application mount.
RedirectMatch 308 "^/c3-lims$" "/b3lims/"
RedirectMatch 308 "^/c3-lims/(.*)$" "/b3lims/$1"

# Preserve navigation from the short-lived hyphenated B3 namespace.
RedirectMatch 308 "^/b3-lims$" "/b3lims/"
RedirectMatch 308 "^/b3-lims/(.*)$" "/b3lims/$1"

RedirectMatch 308 "^/biobank/?$" "/b3lims/workspace/"
RedirectMatch 308 "^/biobank/public(/.*)?$" "/b3lims/public$1"

# =========================
# STATIC FILES
# =========================
Alias /b3lims/static/ /home/public/apps/biobank/static-current/

<Directory /home/public/apps/biobank/static-current>
    Require all granted
</Directory>

# =========================
# PROXY EXCLUSIONS
# =========================

# Managed Jupyter traffic is handled by the independent B3 LIMS
# Jupyter data-plane proxy rather than Gunicorn.
ProxyPassMatch "^/b3lims/internal/lab-tools/jupyter/[0-9]+/node/(gn01|gn02|gn03|n01)/[0-9]+/" "!"

ProxyPass /b3lims/static/ !

# =========================
# DJANGO / GUNICORN
# =========================
ProxyPreserveHost On

ProxyPass        /b3lims/ "unix:/run/biobank/gunicorn.sock|http://localhost:18080/" connectiontimeout=5 timeout=300
ProxyPassReverse /b3lims/ "http://localhost:18080/"

# =========================
# REQUEST METADATA BOUNDARY
# =========================

# Sanitize identity and transport metadata for every B3 LIMS request
# before any route is allowed to reach Django.
#
# Anonymous informational routes must never inherit a client-supplied
# PAM identity. Authenticated routes rebuild the identity header from
# Apache REMOTE_USER in the control-plane block below.
<LocationMatch "^/b3lims(?:$|/)">
    RequestHeader unset X-Biobank-Pam-User

    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
</LocationMatch>

# =========================
# CONTROL-PLANE AUTHENTICATION
# =========================

# PAM protects every B3 LIMS control-plane route except:
#
#   * static assets;
#   * the exact managed-Jupyter data plane;
#   * the explicit informational public routes listed below.
#
# /public/shipments/* intentionally remains inside the PAM boundary.
#
# The public exception is intentionally narrow. It permits only:
#
#   /public/
#   /public/about/
#   /public/governance/
#   /public/collections/
#   /public/collections/<numeric-id>/
#
# Deeper collection paths and every other /public/* path remain
# authenticated by default.
<LocationMatch "^/b3lims($|/(?!static/|internal/lab-tools/jupyter/[0-9]+/node/(?:gn01|gn02|gn03|n01)/[0-9]+/|public/(?:$|about/$|governance/$|collections/$|collections/[0-9]+/$)).*)">
    # Fail2ban maintains root-owned IP state. This early access
    # checker denies only the private B3 LIMS control plane before
    # another PAM authentication attempt is evaluated.
    LuaHookAccessChecker \
        /etc/httpd/biobank/biobank_auth_guard.lua \
        biobank_auth_guard early

    AuthType Basic
    AuthName "B3 LIMS Authentication"
    AuthBasicProvider PAM
    AuthPAMService biobank
    Require valid-user

    # Only Apache-authenticated requests may create this identity
    # metadata for Django.
    RequestHeader set X-Biobank-Pam-User "expr=%{REMOTE_USER}"
</LocationMatch>

# Load the Biobank-owned managed-Jupyter data plane.
IncludeOptional "/etc/httpd/biobank/biobank-jupyter.conf"

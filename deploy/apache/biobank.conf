# C3 LIMS Apache routing and authentication boundary.

# =========================
# LEGACY NAVIGATION REDIRECTS
# =========================

# Retain only controlled navigational compatibility for the previous
# public mount. Deep internal /biobank routes are intentionally not
# retained as a second application namespace.
RedirectMatch 308 "^/biobank/?$" "/c3-lims/workspace/"
RedirectMatch 308 "^/biobank/public(/.*)?$" "/c3-lims/public$1"

# =========================
# STATIC FILES
# =========================
Alias /c3-lims/static/ /home/public/apps/biobank/static-current/

<Directory /home/public/apps/biobank/static-current>
    Require all granted
</Directory>

# =========================
# PROXY EXCLUSIONS
# =========================

# Managed Jupyter traffic is handled by the independent C3 LIMS
# Jupyter data-plane proxy rather than Gunicorn.
ProxyPassMatch "^/c3-lims/internal/lab-tools/jupyter/[0-9]+/node/(gn01|gn02|gn03|n01)/[0-9]+/" "!"

ProxyPass /c3-lims/static/ !

# =========================
# DJANGO / GUNICORN
# =========================
ProxyPreserveHost On

ProxyPass        /c3-lims/ "unix:/run/biobank/gunicorn.sock|http://localhost:18080/" connectiontimeout=5 timeout=300
ProxyPassReverse /c3-lims/ "http://localhost:18080/"

# =========================
# CONTROL-PLANE AUTHENTICATION
# =========================

# PAM protects the C3 LIMS control plane.
#
# Public informational routes intentionally remain inside this PAM
# boundary during the URL/static migration. They will be opened only
# after the new /c3-lims namespace has passed its independent E2E
# validation.
#
# The exact managed-Jupyter data-plane route is excluded because
# Jupyter uses its own protected bearer credential and is independently
# authorized by the C3 LIMS session binding + lease + native token.
<LocationMatch "^/c3-lims($|/(?!static/|internal/lab-tools/jupyter/[0-9]+/node/(?:gn01|gn02|gn03|n01)/[0-9]+/).*)">
    AuthType Basic
    AuthName "C3 LIMS Authentication"
    AuthBasicProvider PAM
    AuthPAMService galaxy
    Require valid-user

    # Never trust identity metadata supplied by the browser.
    RequestHeader unset X-Biobank-Pam-User
    RequestHeader set X-Biobank-Pam-User "expr=%{REMOTE_USER}"

    # Rebuild transport metadata rather than trusting client input.
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
</LocationMatch>

# Load the Biobank-owned managed-Jupyter data plane.
IncludeOptional "/etc/httpd/biobank/biobank-jupyter.conf"

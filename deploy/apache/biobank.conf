# Biobank Apache routing and authentication boundary.

# =========================
# STATIC FILES
# =========================
Alias /biobank/static/ /home/public/apps/biobank/static-current/

<Directory /home/public/apps/biobank/static-current>
    Require all granted
</Directory>

# =========================
# PROXY EXCLUSIONS
# =========================

# Managed Jupyter traffic is handled by the independent Biobank
# Jupyter data-plane proxy rather than Gunicorn.
ProxyPassMatch "^/biobank/internal/lab-tools/jupyter/[0-9]+/node/(gn01|gn02|gn03|n01)/[0-9]+/" "!"

ProxyPass /biobank/static/ !

# =========================
# DJANGO / GUNICORN
# =========================
ProxyPreserveHost On

ProxyPass        /biobank/ "unix:/run/biobank/gunicorn.sock|http://localhost:18080/" connectiontimeout=5 timeout=300
ProxyPassReverse /biobank/ "http://localhost:18080/"

# =========================
# CONTROL-PLANE AUTHENTICATION
# =========================

# PAM protects the Biobank control plane.
#
# The exact managed-Jupyter data-plane route is intentionally
# excluded because Jupyter uses its own protected bearer credential.
# That route is independently authorized by the Biobank Jupyter
# session binding + lease + native Jupyter token.
<LocationMatch "^/biobank($|/(?!static/|internal/lab-tools/jupyter/[0-9]+/node/(?:gn01|gn02|gn03|n01)/[0-9]+/).*)">
    AuthType Basic
    AuthName "B3 LIMS Authentication"
    AuthBasicProvider PAM
    AuthPAMService galaxy
    Require valid-user

    # Never trust identity metadata supplied by the browser.
    RequestHeader unset X-Biobank-Pam-User
    RequestHeader set X-Biobank-Pam-User "expr=%{REMOTE_USER}"

    # Rebuild transport metadata rather than trusting client input.
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
</LocationMatch>

# Load the Biobank-owned managed-Jupyter data plane.
IncludeOptional "/etc/httpd/biobank/biobank-jupyter.conf"

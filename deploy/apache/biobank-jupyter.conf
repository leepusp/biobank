# Independent managed-Jupyter data plane for Biobank.
#
# This configuration does not use Open OnDemand authentication,
# user mapping, node_proxy.lua, or mod_ood_proxy helpers.

LuaAuthzProvider \
    biobank-jupyter-session \
    /etc/httpd/biobank/biobank_jupyter_proxy.lua \
    biobank_jupyter_session_authz

<LocationMatch "^/c3-lims/internal/lab-tools/jupyter/(?<notebook_id>[0-9]+)/node/(?<host>gn01|gn02|gn03|n01)/(?<port>[0-9]+)/">

    # Authentication failures on this data-plane route are forbidden
    # rather than converted into an HTTP Basic authentication challenge.
    AuthzSendForbiddenOnFailure On

    # The Open OnDemand TLS VirtualHost currently has a global Lua
    # request logger at INFO level. Suppress INFO-level Lua logging only
    # for this independent Biobank route. WARN and ERROR remain enabled.
    LogLevel lua_module:warn

    # Permit only an exact active root-controlled notebook binding,
    # a fresh scheduler-validated lease, and a bootstrap credential.
    Require biobank-jupyter-session

    # Normalize backend redirects and cookies to the public base path.
    Header edit Location "^[^/]+//[^/]+" ""
    Header edit* Set-Cookie ";\s*(?i)Domain[^;]*" ""
    Header edit* Set-Cookie ";\s*(?i)Path[^;]*" ""
    Header edit Set-Cookie "^([^;]+)" "$1; Path=/c3-lims/internal/lab-tools/jupyter/%{MATCH_NOTEBOOK_ID}e/node/%{MATCH_HOST}e/%{MATCH_PORT}e"

    LuaHookFixups \
        /etc/httpd/biobank/biobank_jupyter_proxy.lua \
        biobank_jupyter_proxy
</LocationMatch>
